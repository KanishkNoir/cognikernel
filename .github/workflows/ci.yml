name: CI

# The promotion gate (audit P4 / #67). Before this, the project had NO CI: the one
# architectural guardrail (import-linter) could silently die and the failure-path
# tests did not exist, so "green" meant only "the happy-path unit tests a developer
# happened to run locally passed." This workflow makes the guardrails mandatory on
# every push/PR: architecture layering, the full test suite (which includes the
# reliability/failure-injection suite and the contract meta-guard), across the
# supported Python versions.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    # Layering enforcement is its own job so a boundary regression is an
    # unambiguous, fast signal — separate from a test failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dev dependencies
        run: uv sync
      - name: Check import-layering contracts
        # Fails the build if any contract is broken OR if a contract names a
        # nonexistent module (which would abort the run and silently disable
        # enforcement — the audit P2 root cause). lint-imports exits non-zero on
        # both, and the contract meta-guard test (below) re-asserts it.
        run: uv run lint-imports

  test:
    # windows-latest is in the matrix because the platform-specific machinery
    # (Job Object worker teardown, ctypes pid liveness, cp1252 console
    # handling, path canonicalization) is exactly the code a linux-only matrix
    # never exercises. One Windows leg (newest Python) keeps CI cost bounded.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dev dependencies
        run: uv sync --extra embedding
      - name: Run the full test suite
        # Includes tests/reliability/ (failure injection) and the architecture
        # contract meta-guard — the categories the audit showed were missing.
        env:
          COGNIKERNEL_DISABLE_AUTO_WARM: "1"
        run: uv run pytest -q

  fresh-install:
    # The gap that let a broken release ship. Every other job installs from
    # uv.lock, which pins tree-sitter-language-pack to a version the extractor
    # could drive. Real users run `pip install cognikernel`, which resolves the
    # NEWEST compatible dependency — and when that pack changed its binding at
    # 1.13.0, TS/JS extraction returned zero symbols for everyone while CI
    # stayed green. A lock file protects development and hides what users get.
    #
    # This job deliberately does NOT use the lock. It resolves dependencies the
    # way PyPI does, then asserts the tree-sitter-backed extractors actually
    # produce symbols. Extraction fails open, so a smoke import is not enough —
    # the assertion has to look at the output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from source with unpinned resolution
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Report resolved dependency versions
        run: python -c "import importlib.metadata as m; print('tree-sitter', m.version('tree-sitter')); print('tree-sitter-language-pack', m.version('tree-sitter-language-pack'))"
      - name: Assert TS/JS extraction actually yields symbols
        run: |
          python - <<'PY'
          import sys
          from cognikernel.symbols.extractor import EXTRACTORS, typescript_support_status

          ok, detail = typescript_support_status()
          if not ok:
              sys.exit(f"typescript_support_status() is False: {detail}")

          src = 'export class Widget extends Base { render(): void {} }'
          for ext in (".ts", ".tsx", ".js", ".jsx"):
              nodes, _edges = EXTRACTORS[ext].extract("a" + ext, src, "p", frozenset())
              names = {(n.node_type, n.name) for n in nodes}
              if ("class", "Widget") not in names:
                  sys.exit(f"{ext}: expected class Widget, got {names}")
          print("fresh-install extraction OK for .ts/.tsx/.js/.jsx")
          PY
